<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/fooldal.css">
    <title>ZZRent</title>
</head>
<body>
    <div class="felso">
        <img src="img/logo.jpeg" id="logo" alt="ZZRent Logo">
        <input type="text" id="searchBar" class="search-box" placeholder="Search vehicles..." onkeyup="renderProducts()">
        <button type="button" id="loginbutton" class="btn btn-primary">Login</button>
    </div>
    <div class="tartalom" id="carContainer">
        <div class="card car-card" style="width: 18rem;">
            <img src="img/szemelyicon.jpg" class="card-img-top" alt="Passenger Cars">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Passenger Cars</h5>
                <p class="card-text">For 4-5 passengers</p>
                <a href="#" class="btn btn-primary mt-auto">View Details</a>
            </div>
        </div>
    </div>
    <div class="tartalom" id="carContainer">
        <div class="card car-card" style="width: 18rem;">
            <img src="img/kisbuszWeb.jpg" class="card-img-top" alt="Minibuses">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Minibuses</h5>
                <p class="card-text">For 6-9 passengers</p>
                <a href="#" class="btn btn-primary mt-auto">View Details</a>
            </div>
        </div>
    </div>
    <div class="tartalom" id="carContainer">
        <div class="card car-card" style="width: 18rem;">
            <img src="img/van.jpg" class="card-img-top" alt="Cargo Vans">
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">Cargo Vans</h5>
                <p class="card-text">For moving & transport</p>
                <a href="#" class="btn btn-primary mt-auto">View Details</a>
            </div>
        </div>
    </div>
    <!-- Bejelentkezés/Login bootstrap5-->
    <div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal text-white">
                
                <div class="modal-header border-0 pb-0">
                    <ul class="nav nav-tabs border-0 w-100" id="authTab" role="tablist">
                        <li class="nav-item flex-fill text-center" role="presentation">
                            <button class="nav-link active fw-bold text-white w-100" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-panel" type="button" role="tab" aria-controls="login-panel" aria-selected="true">Bejelentkezés</button>
                        </li>
                        <li class="nav-item flex-fill text-center" role="presentation">
                            <button class="nav-link fw-bold text-white w-100" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-panel" type="button" role="tab" aria-controls="register-panel" aria-selected="false">Regisztráció</button>
                        </li>
                    </ul>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="tab-content" id="authTabContent">
                        <div class="tab-pane fade show active" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">E-mail cím</label>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="nev@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label">Jelszó</label>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Belépés</button>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="register-panel" role="tabpanel" aria-labelledby="register-tab">
                            <form id="registerForm">
                                <div class="mb-3">
                                    <label for="regName" class="form-label">Teljes név</label>
                                    <input type="text" class="form-control" id="regName" placeholder="Gipsz Jakab" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label">E-mail cím</label>
                                    <input type="email" class="form-control" id="regEmail" placeholder="nev@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label">Jelszó</label>
                                    <input type="password" class="form-control" id="regPassword" placeholder="A legalább 8 karakter" required>
                                </div>
                                <button type="submit" class="btn btn-success w-100">Regisztráció</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="js/fooldal.js"></script>
</body>
</html>
